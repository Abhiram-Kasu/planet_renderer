<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Planet Renderer</title>
    <style>
      html, body { width: 100%; height: 100%; margin: 0; background: #000; }
      canvas { display: block; width: 100vw; height: 100vh; }
    </style>
  </head>
  <body>
    <pre id="status" style="position:fixed;z-index:1;color:white;background:#222;padding:8px;">Starting WebAssembly…</pre>
    <script type="module">
      import init, { start_web_app } from "./pkg/planet_renderer.js";
      const status = document.getElementById("status");
      try {
        await init();
        start_web_app();
        requestAnimationFrame(() => status.remove());
      } catch (error) {
        status.textContent = error?.stack ?? String(error);
        console.error(error);
      }
    </script>
  </body>
</html>
