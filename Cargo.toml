[package]
name = "planet_renderer"
version = "0.1.0"
edition = "2024"

[dependencies]
bytemuck = "1.25.2"
pollster = "1.0.1"
wgpu = "30.0.1"
winit = "0.30.12"

[build-dependencies]
naga = { version = "30.0.1", features = ["spv-in", "wgsl-out"] }
shaderc = "0.9.1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"

[lib]
path = "src/lib.rs"

[[bin]]
name = "planet_renderer"
path = "src/main.rs"
